<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>操作日志 - 校园失物招领</title>
  <link rel="stylesheet" href="../assets/css/base.css?v=d4d28c8894">
  <link rel="stylesheet" href="../assets/css/modules.css?v=ad3a3ec06e">
  <link rel="stylesheet" href="../assets/css/workbench.css?v=6a526eb869">
</head>
<body class="module-page cms-workflow workbench-page" data-page-title="操作日志">
<div data-cms-shell></div>
<main>
  <header class="panel workbench-heading">
    <div><h1>操作日志</h1><p class="muted">按操作者、动作、结果或时间查找记录。</p></div>
  </header>
  <div id="message" class="message" role="status" aria-live="polite"></div>

  <section class="panel">
    <h2>审计查询</h2>
    <datalist id="audit-actions"></datalist>
    <form id="filters" class="cms-filter-bar">
      <label>操作者 ID
        <input id="operatorId" type="number" min="1" placeholder="可选">
      </label>
      <label>动作
        <input id="action" maxlength="80" list="audit-actions" placeholder="输入或选择动作">
      </label>
      <label>结果
        <select id="result">
          <option value="">全部</option>
          <option value="SUCCESS">成功</option>
          <option value="FAILURE">失败</option>
        </select>
      </label>
      <label>开始时间
        <input id="from" type="datetime-local">
      </label>
      <label>结束时间
        <input id="to" type="datetime-local">
      </label>
      <button type="submit" class="button button-primary">查询</button>
    </form>
  </section>

  <section class="panel">
    <div class="table-scroll" tabindex="0" role="region" aria-label="操作日志列表">
      <table>
        <thead>
        <tr>
          <th>编号</th><th>时间</th><th>操作者</th><th>模块</th><th>动作</th>
          <th>目标</th><th>结果</th><th>耗时(ms)</th><th>请求编号</th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pagination pagination-controls">
      <button type="button" id="prev" class="button button-quiet">上一页</button>
      <span id="pageInfo"></span>
      <button type="button" id="next" class="button button-quiet">下一页</button>
    </div>
  </section>
</main>
<script src="../assets/js/api.js?v=ee5b78cb8a"></script>
<script src="../assets/js/shell.js?v=fceec445c6"></script>
<script src="../yangcheng/common.js?v=a7e2f2e2e0"></script>
<script>
(function () {
  const state = {page: 1, size: 20, total: 0};
  const modules = new Map([
    ['article','物品信息'], ['review','审核'], ['claim','认领'],
    ['auth','账号'], ['category','分类'], ['unknown','未知模块']
  ]);
  const actions = new Map([
    ['REVIEW_DECIDE','处理审核'], ['CLAIM_APPLY','提交认领'], ['CLAIM_DECIDE','核实认领'],
    ['CLAIM_CANCEL','撤销认领'], ['CLAIM_RESOLVE','交接结案'], ['CONTACT_READ','查看联系方式'],
    ['PUBLISH','发布信息'], ['OFFLINE','下架信息'], ['DELETE','删除信息']
  ]);
  const actionCodes = new Map(Array.from(actions, ([code, label]) => [label, code]));
  const actionField = document.getElementById('action');
  const options = document.getElementById('audit-actions');
  for (const label of actions.values()) {
    const option = document.createElement('option');
    option.value = label;
    options.append(option);
  }

  function namedCell(code, labels, fallback) {
    const cell = YC.text('td', labels.get(code) || fallback, 'workbench-result');
    if (code) cell.title = code;
    return cell;
  }

  function iso(value) {
    if (!value) return '';
    return value.length === 16 ? value + ':00' : value;
  }

  let loadSequence = 0;

  async function load() {
    const sequence = ++loadSequence;
    YC.setMessage('message', '正在加载……');
    const action = actionField.value.trim();
    const params = new URLSearchParams({
      page: String(state.page),
      size: String(state.size),
      operatorId: document.getElementById('operatorId').value.trim(),
      action: actionCodes.get(action) || action,
      result: document.getElementById('result').value,
      from: iso(document.getElementById('from').value),
      to: iso(document.getElementById('to').value)
    });
    Array.from(params.keys()).forEach(key => {
      if (!params.get(key)) params.delete(key);
    });
    try {
      const data = await YC.request('/api/operation-logs?' + params.toString());
      if (sequence !== loadSequence) return;
      state.total = data.total;
      render(data.records || []);
      YC.setMessage('message', '');
    } catch (error) {
      if (sequence !== loadSequence || error.name === 'AbortError') return;
      state.total = 0;
      render([]);
      YC.setMessage('message', YC.errorMessage(error), 'error');
    }
    renderPager();
  }

  function render(records) {
    const tbody = document.getElementById('rows');
    tbody.textContent = '';
    if (!records.length) {
      const tr = document.createElement('tr');
      const td = YC.text('td', '暂无日志', 'empty');
      td.colSpan = 9;
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    records.forEach(log => {
      const resultCell = YC.text('td');
      resultCell.appendChild(YC.badge(log.result));
      tbody.appendChild(YC.row([
        log.id,
        YC.formatTime(log.createdAt),
        (log.operatorName || '—') + (log.operatorId ? '（#' + log.operatorId + '）' : ''),
        namedCell(log.module, modules, '其他模块'),
        namedCell(log.action, actions, '其他操作'),
        log.targetId === null || log.targetId === undefined ? '—' : log.targetId,
        resultCell, log.elapsedMs, log.requestId
      ]));
    });
  }

  function renderPager() {
    const pages = Math.max(1, Math.ceil(state.total / state.size));
    document.getElementById('pageInfo').textContent =
      '第 ' + state.page + ' / ' + pages + ' 页，共 ' + state.total + ' 条';
    document.getElementById('prev').disabled = state.page <= 1;
    document.getElementById('next').disabled = state.page >= pages;
  }

  document.getElementById('filters').addEventListener('submit', event => {
    event.preventDefault();
    state.page = 1;
    load();
  });
  document.getElementById('prev').addEventListener('click', () => {
    if (state.page > 1) { state.page -= 1; load(); }
  });
  document.getElementById('next').addEventListener('click', () => {
    if (state.page * state.size < state.total) { state.page += 1; load(); }
  });

  YC.onAccountChange(user => {
    ++loadSequence;
    state.page = 1;
    state.total = 0;
    render([]);
    renderPager();
    if (user) load();
    else YC.setMessage('message', '请登录后查看记录。');
  });
})();
</script>
</body>
</html>
