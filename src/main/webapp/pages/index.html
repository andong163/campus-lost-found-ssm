<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查询校园失物招领信息，登记丢失或拾获的物品。">
  <title>校园首页 · 校园失物招领</title>
  <link rel="stylesheet" href="../assets/css/base.css?v=d4d28c8894">
  <link rel="stylesheet" href="../assets/css/modules.css?v=ad3a3ec06e">
  <script defer src="../assets/js/api.js?v=ee5b78cb8a"></script>
  <script defer src="../assets/js/shell.js?v=fceec445c6"></script>
  <script defer src="../assets/js/item-view.js?v=62ca9423e8"></script>
  <script defer src="../assets/js/home.js?v=fa3eb4246a"></script>
</head>
<body class="home-page" data-page-title="校园首页">
  <div data-cms-shell></div>
  <main class="home-content">
    <section class="home-hero" aria-labelledby="home-title">
      <div class="home-search">
        <h1 id="home-title">校园失物与招领</h1>
        <p>查找丢失的物品，或登记你在校园里捡到的东西。</p>
        <form class="home-search-form" action="items/public.html" method="get" role="search">
          <label class="sr-only" for="home-keyword">物品关键词</label>
          <span class="search-mark" aria-hidden="true"></span>
          <input id="home-keyword" name="keyword" type="search" maxlength="100" placeholder="搜索校园卡、耳机、雨伞…">
          <button class="button button-primary" type="submit">搜索物品</button>
        </form>
        <div class="category-tags" id="public-categories" aria-label="按分类查找" aria-live="polite"></div>
      </div>

      <aside class="home-publish" aria-labelledby="publish-title">
        <h2 id="publish-title">发布物品信息</h2>
        <p>选择类型，填写物品特征和地点。</p>
        <div class="publish-actions">
          <a class="button publish-lost" href="items/create.html?itemType=LOST&ui=soft-20261128-3">发布寻物</a>
          <a class="button publish-found" href="items/create.html?itemType=FOUND&ui=soft-20261128-3">发布招领</a>
        </div>
        <div class="publish-overview" aria-live="polite">
          <p id="public-open-count">正在读取公开信息…</p>
          <a href="items/public.html?resolutionStatus=OPEN&ui=soft-20261128-3">查看未结案</a>
        </div>
      </aside>
    </section>

    <section class="home-section" aria-labelledby="latest-title">
      <div class="section-heading">
        <h2 id="latest-title">最新失物招领</h2>
        <a class="button button-quiet" href="items/public.html?ui=soft-20261128-3">查看全部</a>
      </div>
      <div id="latest-items" class="cms-item-grid" aria-live="polite"><p class="empty-text">正在加载物品…</p></div>
    </section>
  </main>
</body>
</html>
