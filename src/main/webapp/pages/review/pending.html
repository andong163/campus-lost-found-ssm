<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>信息审核与发布 · 校园失物招领</title>
  <link rel="stylesheet" href="../../assets/css/base.css?v=d4d28c8894">
  <link rel="stylesheet" href="../../assets/css/modules.css?v=ad3a3ec06e">
  <link rel="stylesheet" href="../../assets/css/workbench.css?v=6a526eb869">
  <script defer src="../../assets/js/api.js?v=ee5b78cb8a"></script>
  <script defer src="../../assets/js/item-view.js?v=62ca9423e8"></script>
  <script defer src="../../assets/js/shell.js?v=fceec445c6"></script>
</head>
<body class="module-page cms-workflow workbench-page" data-page-title="审核工作台">
  <div data-cms-shell></div>
  <main>
    <header class="panel workbench-heading">
      <div><h1>信息审核与发布</h1><p id="summary" class="muted">查看待审核或待发布的信息</p></div>
      <a class="button button-quiet" href="../../review/review.html?ui=soft-20261128-3">按条件筛选待审核信息</a>
    </header>
    <div class="panel cms-filter-bar">
      <label for="queue">队列
        <select id="queue">
          <option value="pending">待审核</option>
          <option value="approved">待发布</option>
        </select>
      </label>
    </div>
    <p id="notice" class="panel workbench-note" role="status"></p>
    <section id="list" class="review-queue" aria-label="审核队列" aria-live="polite"></section>
    <nav class="pagination" aria-label="审核队列分页">
      <span id="page" class="pagination-summary"></span>
      <div class="pagination-controls">
        <button id="prev" type="button" class="button button-quiet" disabled>上一页</button>
        <button id="next" type="button" class="button button-quiet" disabled>下一页</button>
      </div>
    </nav>
  </main>
  <script src="../../assets/js/items.js?v=d95317b5a6"></script>
  <script>
    const list = document.querySelector('#list');
    const queue = document.querySelector('#queue');
    const summary = document.querySelector('#summary');
    const pageText = document.querySelector('#page');
    const prev = document.querySelector('#prev');
    const next = document.querySelector('#next');
    const size = 10;
    const queuePrompt = '查看待审核或待发布的信息';
    let page = 1, total = 0, sequence = 0, busy = false, writing = false;
    let currentIdentity, categories;

    async function loadCategoryNames() {
      const names = new Map();
      try {
        const tree = await Cms.api.request('/api/public/categories');
        function add(nodes) {
          for (const category of nodes) {
            names.set(String(category.id), category.name);
            add(category.children || []);
          }
        }
        add(tree);
        return names;
      } catch (_) {
        categories = null;
        return names;
      }
    }

    function updateControls() {
      const inactive = busy || writing || !Cms.shell.user;
      prev.disabled = inactive || page <= 1;
      next.disabled = inactive || page * size >= total;
      queue.disabled = writing;
      list.querySelectorAll('button').forEach(button => { button.disabled = inactive; });
    }

    async function act(item, action, comment = '') {
      if (busy || writing) return;
      const identity = Cms.shell.user?.id;
      writing = true;
      updateControls();
      try {
        const data = {version:item.version};
        if (action !== 'publish') data.comment = comment;
        await write('/reviews/' + encodeURIComponent(item.id) + '/' + action, 'POST', data);
        if (identity === Cms.shell.user?.id) await load(action === 'publish' ? '信息已发布。' : '审核意见已保存。');
      } catch (error) {
        if (identity === Cms.shell.user?.id && error.name !== 'AbortError') show(error.message, true);
      } finally {
        writing = false;
        updateControls();
      }
    }

    function reviewCard(item, pending, names) {
      const card = itemUi.node('article', 'panel review-card');
      const labels = itemUi.node('div', 'review-labels');
      labels.append(Cms.itemView.idBadge(item.id), Cms.itemView.typeBadge(item),
        itemUi.badge(item.status, pending ? '待审核' : '待发布'));
      const facts = itemUi.node('dl', 'review-facts');
      facts.append(itemUi.fact('物品分类', item.categoryName || names.get(String(item.categoryId)) || '分类暂不可用'),
        itemUi.fact('地点', item.location || '—'), itemUi.fact('版本', String(item.version ?? '—')));
      card.append(labels, itemUi.node('h2', '', item.title), itemUi.node('p', 'review-description', item.content), facts);
      const controls = itemUi.node('div', 'review-controls');
      const buttons = itemUi.node('div', 'review-buttons');
      if (pending && Cms.shell.hasPermission('review:decide')) {
        const field = itemUi.node('label', '', '审核意见');
        const comment = itemUi.node('textarea');
        comment.placeholder = '批准可留空，驳回时请说明原因';
        comment.maxLength = 500;
        field.append(comment);
        controls.append(field);
        const approve = itemUi.button('批准', 'primary');
        const reject = itemUi.button('驳回', 'danger');
        approve.onclick = () => act(item, 'approve', comment.value.trim());
        reject.onclick = () => {
          if (!comment.value.trim()) {
            show('请先填写驳回意见。', true);
            comment.focus();
            return;
          }
          act(item, 'reject', comment.value.trim());
        };
        buttons.append(approve, reject);
      } else if (!pending && Cms.shell.hasPermission('item:publish')) {
        const publish = itemUi.button('发布', 'primary');
        publish.onclick = () => act(item, 'publish');
        buttons.append(publish);
      }
      if (buttons.childElementCount) {
        controls.append(buttons);
        card.append(controls);
      }
      return card;
    }

    async function load(message = '') {
      const request = ++sequence;
      const selected = queue.value;
      const pending = selected === 'pending';
      busy = true;
      show('');
      list.replaceChildren(itemUi.node('p', 'panel review-empty', '正在加载队列…'));
      updateControls();
      try {
        const [data, names] = await Promise.all([
          api('/reviews/' + selected + '?page=' + page + '&size=' + size),
          categories || (categories = loadCategoryNames())
        ]);
        if (request !== sequence) return;
        total = data.total;
        const lastPage = Math.max(1, Math.ceil(total / size));
        if (page > lastPage) {
          page = lastPage;
          await load(message);
          return;
        }
        const cards = data.records.map(item => reviewCard(item, pending, names));
        const label = pending ? '待审核' : '待发布';
        list.replaceChildren(...(cards.length ? cards : [itemUi.node('p', 'panel review-empty', '暂无' + label + '信息。')]));
        summary.textContent = label + '共 ' + total + ' 条';
        pageText.textContent = '第 ' + page + ' 页，共 ' + lastPage + ' 页';
        show(message);
      } catch (error) {
        if (request !== sequence) return;
        total = 0;
        pageText.textContent = '';
        summary.textContent = queuePrompt;
        list.replaceChildren();
        if (error.name !== 'AbortError') show(error.message, true);
      } finally {
        if (request === sequence) { busy = false; updateControls(); }
      }
    }

    function syncAccount(user) {
      const identity = user?.id ?? null;
      if (currentIdentity === identity) return;
      currentIdentity = identity;
      ++sequence;
      page = 1;
      total = 0;
      busy = false;
      list.replaceChildren();
      pageText.textContent = '';
      summary.textContent = queuePrompt;
      if (user) load();
      else show('请登录后查看审核队列。');
      updateControls();
    }

    queue.onchange = () => { if (Cms.shell.user) { page = 1; load(); } };
    prev.onclick = () => { if (!prev.disabled) { page--; load(); } };
    next.onclick = () => { if (!next.disabled) { page++; load(); } };
    window.addEventListener('cms:authchange', event => syncAccount(event.detail.user));
    document.addEventListener('DOMContentLoaded', async () => {
      await Cms.shell.ready;
      syncAccount(Cms.shell.user);
    }, {once:true});
  </script>
</body>
</html>
