<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分类管理 - 校园失物招领</title>
  <link rel="stylesheet" href="../../assets/css/base.css?v=d4d28c8894">
  <link rel="stylesheet" href="../../assets/css/modules.css?v=ad3a3ec06e">
  <style>
    .category-page .layout { display: grid; grid-template-columns: minmax(16rem, 22rem) minmax(0, 1fr); gap: 18px; align-items: start; }
    .category-page .hint { color: var(--muted); font-size: .85rem; line-height: 1.6; }
    .category-page .toolbar, .category-page .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .category-page .tree, .category-page .tree ul { list-style: none; margin: 0; padding: 0; }
    .category-page .tree ul { margin-left: 6px; padding-left: 14px; border-left: 1px solid var(--line); }
    .category-page .tree .node { justify-content: space-between; width: 100%; text-align: left; border-color: transparent; background: transparent; white-space: normal; overflow-wrap: anywhere; }
    .category-page .tree .node:hover { background: var(--surface-subtle); }
    .category-page .tree .node.active { background: var(--accent-tint); color: var(--accent); }
    .category-page .tree .node.disabled { color: var(--muted); }
    .category-page .field { display: grid; gap: 4px; margin-bottom: 12px; }
    .category-page .field label { font-size: .85rem; }
    .category-page .field :is(input, select) { min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius-field); background: var(--field-bg); color: var(--ink); }
    .category-page .row { display: flex; align-items: center; gap: 8px; }
    #toast { position: fixed; z-index: 40; left: 50%; bottom: 2rem; transform: translateX(-50%); background: var(--accent); color: var(--paper);
             padding: 10px 16px; border-radius: var(--radius-control); font-size: .9rem; opacity: 0; pointer-events: none; }
    #toast.show { opacity: 1; }
    #toast.error { background: var(--error-ink); }
    @media (prefers-reduced-motion: no-preference) { #toast { transition: opacity 200ms ease; } }
  </style>
  <link rel="stylesheet" href="../../assets/css/workbench.css?v=6a526eb869">
</head>
<body class="category-page workbench-page" data-page-title="分类管理">
  <div data-cms-shell></div>
  <main>
  <header class="panel workbench-heading">
    <div><h1>分类管理</h1><p class="muted">维护物品分类及其显示顺序。</p></div>
  </header>
    <section class="panel" id="login-panel" hidden>
      <p id="category-access-message" role="status"></p>
      <button class="button button-primary" type="button" data-login>登录 / 注册</button>
    </section>

    <div class="layout" id="workspace" hidden>
      <section class="panel">
        <div class="toolbar">
          <button class="button button-primary" type="button" id="create-root">新增根分类</button>
          <button class="button button-quiet" type="button" id="refresh">刷新</button>
        </div>
        <div id="tree-host"><p class="hint">加载中…</p></div>
      </section>

      <section class="panel" id="editor" hidden>
        <h2 id="editor-title">编辑分类</h2>
        <div class="field">
          <label for="edit-name">名称</label>
          <input id="edit-name" maxlength="80">
        </div>
        <div class="field">
          <label for="edit-parent">上级分类</label>
          <select id="edit-parent"></select>
        </div>
        <div class="field">
          <label for="edit-sort">排序值（升序，0 在最前）</label>
          <input id="edit-sort" type="number" min="0" step="1">
        </div>
        <div class="field">
          <label>状态</label>
          <div class="row">
            <input id="edit-enabled" type="checkbox">
            <label for="edit-enabled">启用（停用后该分类及其子树不会出现在公开查询里）</label>
          </div>
        </div>
        <div class="actions">
          <button class="button button-primary" type="button" id="save-node">保存</button>
          <button class="button button-danger" type="button" id="delete-node">删除</button>
        </div>
        <p class="hint" id="editor-hint"></p>
      </section>

      <section class="panel" id="creator" hidden>
        <h2>新增分类</h2>
        <div class="field">
          <label for="new-name">名称</label>
          <input id="new-name" maxlength="80">
        </div>
        <div class="field">
          <label for="new-parent">上级分类</label>
          <select id="new-parent"></select>
        </div>
        <div class="field">
          <label for="new-sort">排序值</label>
          <input id="new-sort" type="number" min="0" step="1" value="0">
        </div>
        <div class="actions">
          <button class="button button-primary" type="button" id="create-node">创建</button>
          <button class="button button-quiet" type="button" id="cancel-create">取消</button>
        </div>
      </section>
    </div>
  </main>

  <div id="toast"></div>

  <script src="../../assets/js/api.js?v=ee5b78cb8a"></script>
  <script src="../../assets/js/shell.js?v=fceec445c6"></script>
  <script>
    'use strict';

    const state = { nodes: [], byId: new Map(), selected: null };
    const el = (id) => document.getElementById(id);
    const loginPanel = el('login-panel');
    const workspace = el('workspace');
    const editor = el('editor');
    const creator = el('creator');
    const treeHost = el('tree-host');

    /** 统一请求封装：会话 Cookie 同源携带，非 2xx 或业务码非 200 时抛错。 */
    async function api(path, options = {}) {
      return Cms.api.request(path, options);
    }

    function toast(message, isError = false) {
      const box = el('toast');
      box.textContent = message;
      box.classList.toggle('error', isError);
      box.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => box.classList.remove('show'), 2600);
    }

    function flatten(nodes, depth = 0, output = []) {
      for (const node of nodes) {
        output.push({ node, depth });
        if (node.children && node.children.length) flatten(node.children, depth + 1, output);
      }
      return output;
    }

    function buildNode(node) {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'button button-quiet node' + (node.enabled ? '' : ' disabled');
      const name = document.createElement('span');
      name.textContent = node.name;
      const badge = document.createElement('span');
      badge.className = 'cms-badge ' + (node.enabled ? 'cms-badge-positive' : 'cms-badge-muted');
      badge.textContent = node.enabled ? '启用' : '停用';
      button.append(name, badge);
      button.title = '排序值 ' + node.sortOrder + '，id ' + node.id;
      if (state.selected && state.selected.id === node.id) button.classList.add('active');
      button.addEventListener('click', () => selectNode(node));
      li.appendChild(button);
      if (node.children && node.children.length) {
        const ul = document.createElement('ul');
        for (const child of node.children) ul.appendChild(buildNode(child));
        li.appendChild(ul);
      }
      return li;
    }

    function renderTree() {
      treeHost.textContent = '';
      if (!state.nodes.length) {
        const empty = document.createElement('p');
        empty.className = 'hint';
        empty.textContent = '还没有分类，点击「新增根分类」开始。';
        treeHost.appendChild(empty);
        return;
      }
      const ul = document.createElement('ul');
      ul.className = 'tree';
      for (const node of state.nodes) ul.appendChild(buildNode(node));
      treeHost.appendChild(ul);
    }

    /** 父级下拉：扁平化所有分类，排除自身及其后代，避免提交后必然 409。 */
    function fillParentOptions(select, excludeId) {
      select.textContent = '';
      const rootOption = document.createElement('option');
      rootOption.value = '';
      rootOption.textContent = '（无，作为根分类）';
      select.appendChild(rootOption);
      const excluded = new Set();
      if (excludeId !== undefined && excludeId !== null) {
        collectSubtreeIds(state.byId.get(excludeId), excluded);
      }
      for (const { node, depth } of flatten(state.nodes)) {
        if (excluded.has(node.id)) continue;
        const option = document.createElement('option');
        option.value = String(node.id);
        option.textContent = '　'.repeat(depth) + node.name + (node.enabled ? '' : '（已停用）');
        select.appendChild(option);
      }
    }

    function collectSubtreeIds(node, output) {
      if (!node) return output;
      output.add(node.id);
      for (const child of node.children || []) collectSubtreeIds(child, output);
      return output;
    }

    function selectNode(node) {
      state.selected = node;
      editor.hidden = false;
      creator.hidden = true;
      el('editor-title').textContent = '编辑分类：' + node.name;
      el('edit-name').value = node.name;
      el('edit-sort').value = String(node.sortOrder);
      el('edit-enabled').checked = node.enabled;
      fillParentOptions(el('edit-parent'), node.id);
      el('edit-parent').value = node.parentId === null ? '' : String(node.parentId);
      el('editor-hint').textContent = '编号 #' + node.id + '　创建于 ' + (node.createdAt?.replace('T', ' ').slice(0,16) || '—');
      renderTree();
    }

    let loadSequence = 0;
    async function loadTree() {
      const sequence = ++loadSequence;
      const refreshButton = el('refresh');
      const createRootButton = el('create-root');
      refreshButton.disabled = true;
      createRootButton.disabled = true;
      if (state.nodes.length === 0) treeHost.textContent = '加载中…';
      try {
        const nodes = await api('/api/categories/tree');
        if (sequence !== loadSequence) return;
        state.nodes = nodes || [];
        state.byId = new Map();
        for (const { node } of flatten(state.nodes)) state.byId.set(node.id, node);
        if (state.selected) {
          state.selected = state.byId.get(state.selected.id) || null;
          if (!state.selected) editor.hidden = true;
        }
        loginPanel.hidden = true;
        workspace.hidden = false;
        renderTree();
      } catch (error) {
        if (sequence !== loadSequence || error.name === 'AbortError') return;
        if (error.status === 401) {
          workspace.hidden = true;
          loginPanel.hidden = false;
        } else {
          toast(error.message, true);
        }
      } finally {
        if (sequence !== loadSequence) return;
        refreshButton.disabled = false;
        createRootButton.disabled = false;
      }
    }

    async function saveNode() {
      const node = state.selected;
      if (!node) return;
      const payload = {
        name: el('edit-name').value.trim(),
        parentId: el('edit-parent').value === '' ? null : Number(el('edit-parent').value),
        sortOrder: Number(el('edit-sort').value),
        enabled: el('edit-enabled').checked
      };
      const button = el('save-node');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '保存中…';
      try {
        if (payload.name !== node.name) {
          await api('/api/categories/' + node.id, { method: 'PUT', body: { name: payload.name } });
        }
        if (payload.parentId !== (node.parentId === undefined ? null : node.parentId)) {
          await api('/api/categories/' + node.id + '/parent', { method: 'PUT', body: { parentId: payload.parentId } });
        }
        if (payload.sortOrder !== node.sortOrder) {
          await api('/api/categories/' + node.id + '/sort', { method: 'PUT', body: { sortOrder: payload.sortOrder } });
        }
        if (payload.enabled !== node.enabled) {
          await api('/api/categories/' + node.id + '/enabled', { method: 'PUT', body: { enabled: payload.enabled } });
        }
        toast('已保存');
        await loadTree();
      } catch (error) {
        toast(error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    async function deleteNode() {
      const node = state.selected;
      if (!node) return;
      if (!window.confirm('确认删除分类「' + node.name + '」？')) return;
      const button = el('delete-node');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '删除中…';
      try {
        await api('/api/categories/' + node.id, { method: 'DELETE' });
        state.selected = null;
        editor.hidden = true;
        toast('已删除');
        await loadTree();
      } catch (error) {
        toast(error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    async function createNode() {
      const name = el('new-name').value.trim();
      if (!name) { toast('请填写分类名称', true); return; }
      const button = el('create-node');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '创建中…';
      try {
        await api('/api/categories', {
          method: 'POST',
          body: {
            name,
            parentId: el('new-parent').value === '' ? null : Number(el('new-parent').value),
            sortOrder: Number(el('new-sort').value)
          }
        });
        el('new-name').value = '';
        creator.hidden = true;
        toast('已创建');
        await loadTree();
      } catch (error) {
        toast(error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function openCreator() {
      creator.hidden = false;
      editor.hidden = true;
      el('new-name').value = '';
      el('new-sort').value = '0';
      fillParentOptions(el('new-parent'), null);
      el('new-parent').value = '';
      el('new-name').focus();
    }

    let accountSignature;
    function syncAccount(user) {
      const allowed = Cms.shell.hasPermission('category:view');
      const signature = user ? user.id + ':' + allowed : 'guest';
      if (signature === accountSignature) return;
      accountSignature = signature;
      ++loadSequence;
      state.nodes = [];
      state.byId.clear();
      state.selected = null;
      workspace.hidden = true;
      editor.hidden = creator.hidden = true;
      treeHost.replaceChildren();
      loginPanel.hidden = allowed;
      loginPanel.querySelector('button').hidden = !!user;
      el('category-access-message').textContent = user ? '当前账号没有分类管理权限。' : '请登录有分类管理权限的账号。';
      if (allowed) loadTree();
    }
    window.addEventListener('cms:authchange', event => syncAccount(event.detail.user));
    Cms.shell.ready.then(() => syncAccount(Cms.shell.user));

    el('refresh').addEventListener('click', () => loadTree());
    el('create-root').addEventListener('click', openCreator);
    el('cancel-create').addEventListener('click', () => { creator.hidden = true; });
    el('create-node').addEventListener('click', createNode);
    el('save-node').addEventListener('click', saveNode);
    el('delete-node').addEventListener('click', deleteNode);
  </script>
</body>
</html>
