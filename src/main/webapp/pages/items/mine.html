<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的信息 · 校园失物招领</title>
  <link rel="stylesheet" href="../../assets/css/base.css?v=d4d28c8894">
  <link rel="stylesheet" href="../../assets/css/modules.css?v=ad3a3ec06e">
  <link rel="stylesheet" href="../../assets/css/items-workspace.css?v=bfe6bbea3a">
  <script defer src="../../assets/js/api.js?v=ee5b78cb8a"></script>
  <script defer src="../../assets/js/item-view.js?v=62ca9423e8"></script>
  <script defer src="../../assets/js/shell.js?v=fceec445c6"></script>
</head>
<body class="module-page items-workspace" data-page-title="我的信息">
  <div data-cms-shell></div>
  <main>
    <header class="panel item-header">
      <div><h1>我的信息</h1><p id="summary" class="muted item-count">查看你登记的寻物和招领信息</p></div>
      <a id="create-item" class="button button-primary" href="create.html?ui=soft-20261128-3" hidden>发布新信息</a>
    </header>
    <div class="panel cms-filter-bar item-filter">
      <label for="status">状态筛选
        <select id="status">
          <option value="">全部状态</option><option value="DRAFT">草稿</option>
          <option value="PENDING_REVIEW">待审核</option><option value="APPROVED">已批准</option>
          <option value="PUBLISHED">已发布</option><option value="REJECTED">已驳回</option>
          <option value="OFFLINE">已下架</option>
        </select>
      </label>
    </div>
    <p id="notice" class="panel item-notice" role="status"></p>
    <section id="list" class="item-list" aria-label="我的信息列表" aria-live="polite"></section>
    <nav class="pagination record-pagination" aria-label="信息分页">
      <span id="page" class="pagination-summary"></span>
      <div class="pagination-controls">
        <button id="prev" class="button button-quiet" type="button" disabled>上一页</button>
        <button id="next" class="button button-quiet" type="button" disabled>下一页</button>
      </div>
    </nav>
  </main>
  <script src="../../assets/js/items.js?v=d95317b5a6"></script>
  <script>
    const list = document.querySelector('#list');
    const statusFilter = document.querySelector('#status');
    const summary = document.querySelector('#summary');
    const pageText = document.querySelector('#page');
    const create = document.querySelector('#create-item');
    const prev = document.querySelector('#prev');
    const next = document.querySelector('#next');
    const size = 10;
    let current = 1, total = 0, sequence = 0, busy = false, identity;

    function updatePagination() {
      prev.disabled = busy || current <= 1;
      next.disabled = busy || current * size >= total;
    }

    async function load() {
      const request = ++sequence;
      busy = true;
      updatePagination();
      show('');
      list.replaceChildren(itemUi.node('p', 'panel item-empty', '正在加载信息…'));
      try {
        const query = new URLSearchParams({page:current, size});
        if (statusFilter.value) query.set('status', statusFilter.value);
        const data = await api('/items/mine?' + query);
        if (request !== sequence) return;
        total = data.total;
        const scope = statusFilter.value ? '筛选结果' : '登记记录';
        summary.textContent = scope + '共 ' + total + ' 条';
        const cards = data.records.map(itemUi.ownerCard);
        list.replaceChildren(...(cards.length ? cards : [
          itemUi.node('p', 'panel item-empty', statusFilter.value ? '当前状态下暂无信息。' : '还没有登记信息。')
        ]));
        pageText.textContent = '第 ' + current + ' 页，共 ' + Math.max(1, Math.ceil(total / size)) + ' 页';
      } catch (error) {
        if (request !== sequence) return;
        total = 0;
        list.replaceChildren();
        pageText.textContent = '';
        summary.textContent = '查看你登记的寻物和招领信息';
        if (error.name !== 'AbortError') show(error.message, true);
      } finally {
        if (request === sequence) { busy = false; updatePagination(); }
      }
    }

    window.addEventListener('cms:authchange', event => {
      const account = event.detail.user?.id;
      if (account === identity) return;
      identity = account;
      ++sequence;
      busy = false;
      current = 1;
      total = 0;
      list.replaceChildren();
      pageText.textContent = '';
      summary.textContent = '查看你登记的寻物和招领信息';
      create.hidden = !Cms.shell.hasPermission('item:create');
      if (!event.detail.user) show(Cms.api.messages[401], true);
      updatePagination();
    });
    statusFilter.onchange = () => { current = 1; load(); };
    prev.onclick = () => { if (!prev.disabled) { current--; load(); } };
    next.onclick = () => { if (!next.disabled) { current++; load(); } };
    document.addEventListener('DOMContentLoaded', async () => {
      await Cms.shell.ready;
      create.hidden = !Cms.shell.hasPermission('item:create');
      load();
    }, {once:true});
  </script>
</body>
</html>
