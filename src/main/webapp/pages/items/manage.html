<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信息管理</title><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="../../assets/css/modules.css"><script defer src="../../assets/js/api.js"></script><script defer src="../../assets/js/shell.js"></script></head><body class="module-page" data-page-title="信息管理"><div data-cms-shell></div><main><h1>信息管理</h1><form id="filter"><select name="status"><option value="">全部状态</option><option>APPROVED</option><option>PUBLISHED</option><option>OFFLINE</option><option>DRAFT</option><option>PENDING_REVIEW</option><option>REJECTED</option></select><input name="authorId" type="number" min="1" placeholder="作者 ID"><button>查询</button></form><p id="notice" role="status"></p><div id="list" aria-live="polite">加载中…</div><p><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></p><p><button data-action="publish">批量发布</button> <button data-action="offline">批量下架</button> <button data-action="delete">批量删除</button></p></main><script>
const form=document.querySelector('#filter'),list=document.querySelector('#list'),notice=document.querySelector('#notice');let page=1,total=0,records=[];const size=10;
async function load(){list.textContent='加载中…';notice.textContent='';const q=new URLSearchParams(new FormData(form));for(const [k,v] of [...q])if(!v)q.delete(k);q.set('page',page);q.set('size',size);history.replaceState(null,'','?'+q);try{const data=await Cms.api.request('/api/items?'+q);records=data.records;total=data.total;list.replaceChildren();if(!records.length)list.textContent='暂无信息';for(const item of records){const row=document.createElement('p'),check=document.createElement('input'),link=document.createElement('a');check.type='checkbox';check.value=item.id;check.setAttribute('aria-label','选择 '+item.title);link.href=item.status==='PUBLISHED'?'public-detail.html?id='+encodeURIComponent(item.id):'#';link.textContent=item.title;row.append(check,link,document.createTextNode(` · 作者 ${item.authorId} · ${item.status} · 版本 ${item.version}`));for(const [action,label] of [['publish','发布'],['offline','下架'],['delete','删除']]){if((action==='publish'&&!['APPROVED','OFFLINE'].includes(item.status))||(action==='offline'&&item.status!=='PUBLISHED'))continue;const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{button.disabled=true;try{const path=action==='offline'?'/api/items/'+item.id+'/manage-offline':'/api/items/'+item.id+(action==='publish'?'/publish':'');await Cms.api.request(path,{method:action==='delete'?'DELETE':'POST',body:{version:item.version}});await load();notice.textContent=label+'成功'}catch(e){notice.textContent=e.message;button.disabled=false}};row.append(button)}list.append(row)}document.querySelector('#page').textContent=`第 ${page} 页，共 ${total} 条`;document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page*size>=total}catch(e){list.textContent='加载失败';notice.textContent=e.message}}
(async()=>{const q=new URLSearchParams(location.search);for(const [k,v] of q)if(form.elements[k])form.elements[k].value=v;page=Math.max(1,Number(q.get('page'))||1);load()})();form.onsubmit=e=>{e.preventDefault();page=1;load()};document.querySelector('#prev').onclick=()=>{page--;load()};document.querySelector('#next').onclick=()=>{page++;load()};
for(const button of document.querySelectorAll('[data-action]'))button.onclick=async()=>{const ids=[...list.querySelectorAll('input:checked')].map(x=>Number(x.value));if(!ids.length){notice.textContent='请先勾选信息';return}const versions={};for(const item of records)if(ids.includes(item.id))versions[item.id]=item.version;button.disabled=true;notice.textContent='正在处理…';try{const count=await Cms.api.request('/api/items/batch-'+button.dataset.action,{method:'POST',body:{ids,versions}});await load();notice.textContent=`成功处理 ${count} 条`}catch(e){notice.textContent=e.message;await load()}finally{button.disabled=false}};
</script></body></html>
