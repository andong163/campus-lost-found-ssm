<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寻物招领</title><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="../../assets/css/modules.css"><script defer src="../../assets/js/api.js"></script><script defer src="../../assets/js/shell.js"></script></head><body class="module-page" data-page-title="寻物招领"><div data-cms-shell></div><main><h1>寻物招领</h1><form id="filter"><input name="keyword" placeholder="标题或描述"><select name="itemType"><option value="">全部类型</option><option value="LOST">寻物</option><option value="FOUND">招领</option></select><select name="categoryId"><option value="">全部分类</option></select><input name="location" placeholder="地点"><input name="from" type="datetime-local" aria-label="开始时间"><input name="to" type="datetime-local" aria-label="结束时间"><select name="resolutionStatus"><option value="">全部处理状态</option><option value="OPEN">未结案</option><option value="RESOLVED">已结案</option></select><select name="sortBy"><option value="publishedAt">发布时间</option><option value="eventTime">事发时间</option></select><select name="direction"><option value="desc">倒序</option><option value="asc">正序</option></select><button>查询</button></form><p id="notice" role="status"></p><div id="list" aria-live="polite">加载中…</div><p><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></p></main><script>
const form=document.querySelector('#filter'),notice=document.querySelector('#notice'),list=document.querySelector('#list');let page=1,total=0;const size=10;
function options(nodes,depth=0){for(const n of nodes){const option=document.createElement('option');option.value=n.id;option.textContent='　'.repeat(depth)+n.name;form.elements.categoryId.append(option);options(n.children,depth+1)}}
async function load(){list.textContent='加载中…';notice.textContent='';const q=new URLSearchParams(new FormData(form));for(const [k,v] of [...q])if(!v)q.delete(k);q.set('page',page);q.set('size',size);history.replaceState(null,'','?'+q);try{const data=await Cms.api.request('/api/public/items?'+q);total=data.total;list.replaceChildren();if(!data.records.length)list.textContent='暂无符合条件的信息';for(const item of data.records){const row=document.createElement('p'),link=document.createElement('a');link.href='public-detail.html?id='+encodeURIComponent(item.id);link.textContent=item.title;row.append(link,document.createTextNode(' · '+(item.itemType==='LOST'?'寻物':'招领')+' · '+item.location+' · '+(item.resolutionStatus==='RESOLVED'?'已结案':'未结案')));list.append(row)}document.querySelector('#page').textContent=`第 ${page} 页，共 ${total} 条`;document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page*size>=total}catch(e){list.textContent='加载失败';notice.textContent=e.message}}
(async()=>{const q=new URLSearchParams(location.search);for(const [k,v] of q)if(form.elements[k])form.elements[k].value=v;page=Math.max(1,Number(q.get('page'))||1);try{const tree=await Cms.api.request('/api/public/categories');options(tree);if(q.get('categoryId'))form.elements.categoryId.value=q.get('categoryId')}catch(e){notice.textContent='分类加载失败：'+e.message}load()})();form.onsubmit=e=>{e.preventDefault();page=1;load()};document.querySelector('#prev').onclick=()=>{page--;load()};document.querySelector('#next').onclick=()=>{page++;load()};
</script></body></html>
