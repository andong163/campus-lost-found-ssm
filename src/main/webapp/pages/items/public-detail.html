<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公开信息详情</title><link rel="stylesheet" href="../../assets/css/base.css"><script defer src="../../assets/js/api.js"></script><script defer src="../../assets/js/shell.js"></script></head><body class="module-page" data-page-title="公开信息详情"><div data-cms-shell></div><main><nav><a href="public.html">返回公开列表</a></nav><h1 id="title">加载中…</h1><p id="notice" role="status"></p><p id="meta"></p><p id="content"></p></main><script>
document.addEventListener('DOMContentLoaded', async function () {
await Cms.shell.ready;
const id=new URLSearchParams(location.search).get('id');if(!/^\d+$/.test(id||'')){document.querySelector('#title').textContent='无效的信息 ID'}else Cms.api.request('/api/public/items/'+encodeURIComponent(id)).then(item=>{document.querySelector('#title').textContent=item.title;document.querySelector('#meta').textContent=`${item.itemType==='LOST'?'寻物':'招领'} · ${item.location} · ${item.eventTime} · ${item.resolutionStatus==='RESOLVED'?'已结案':'未结案'}`;document.querySelector('#content').textContent=item.content}).catch(e=>{document.querySelector('#title').textContent='无法显示信息';document.querySelector('#notice').textContent=e.message});
}, {once:true});
</script></body></html>
