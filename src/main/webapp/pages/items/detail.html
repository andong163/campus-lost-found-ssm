<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>信息详情 · 校园失物招领</title>
  <link rel="stylesheet" href="../../assets/css/base.css?v=d4d28c8894">
  <link rel="stylesheet" href="../../assets/css/modules.css?v=ad3a3ec06e">
  <link rel="stylesheet" href="../../assets/css/items-workspace.css?v=bfe6bbea3a">
  <script defer src="../../assets/js/api.js?v=ee5b78cb8a"></script>
  <script defer src="../../assets/js/shell.js?v=fceec445c6"></script>
  <script defer src="../../assets/js/item-view.js?v=62ca9423e8"></script>
  <script defer src="../../assets/js/r4-detail.js?v=95f8faa2a6"></script>
</head>
<body class="module-page items-workspace" data-page-title="信息详情" data-r4-detail="owner">
  <div data-cms-shell></div>
  <main class="items-narrow">
    <a class="button button-quiet item-back" href="mine.html?ui=soft-20261128-3">返回我的信息</a>
    <p id="notice" class="panel item-notice" role="status">正在加载信息…</p>
    <div id="owner-detail" hidden>
      <article class="panel detail-panel item-owner-detail" aria-labelledby="title">
        <header class="detail-heading">
          <div id="state" class="record-labels"></div>
          <h1 id="title">信息详情</h1>
        </header>
        <dl id="meta" class="detail-facts"></dl>
        <section class="detail-description" aria-labelledby="description">
          <h2 id="description">物品描述</h2>
          <p id="content"></p>
        </section>
        <div class="item-action-bar">
          <div id="actions" class="record-actions"></div>
          <div id="r4-contact">
            <button id="r4-contact-button" class="button button-quiet" type="button">查看联系方式</button>
          </div>
          <div id="r4-resolve"></div>
        </div>
        <p id="r4-contact-value" aria-live="polite"></p>
        <p id="r4-history" class="muted" aria-live="polite"></p>
      </article>
      <section class="panel item-reviews" aria-labelledby="review-heading">
        <h2 id="review-heading">审核意见</h2>
        <div id="reviews" class="item-review-list" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <script src="../../assets/js/items.js?v=d95317b5a6"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const path = '/items/' + encodeURIComponent(id);
    const detail = document.querySelector('#owner-detail');
    const reviews = document.querySelector('#reviews');
    const actions = document.querySelector('#actions');

    function renderReviews(records) {
      if (!records.length) {
        reviews.replaceChildren(itemUi.node('p', 'muted item-review-empty', '暂无审核记录。'));
        return;
      }
      reviews.replaceChildren(...records.map(record => {
        const row = itemUi.node('div', 'item-review');
        const labels = itemUi.node('div', 'record-labels muted');
        labels.append(itemUi.badge(record.decision, record.decision === 'APPROVED' ? '审核通过' : '审核驳回'));
        if (record.reviewerName) labels.append(itemUi.node('span', '', record.reviewerName));
        if (record.createdAt) labels.append(itemUi.time(record.createdAt));
        row.append(labels, itemUi.node('p', '', record.comment || '无意见'));
        return row;
      }));
    }

    function renderActions(item) {
      actions.replaceChildren();
      const can = Cms.shell.hasPermission;
      if (itemUi.canEdit(item)) actions.append(itemUi.link('编辑', 'edit.html?id=' + encodeURIComponent(id)));
      const transitions = {
        DRAFT: ['submit','提交审核','item:submit'],
        REJECTED: ['submit','重新提交审核','item:submit'],
        PENDING_REVIEW: ['withdraw','撤回','item:withdraw'],
        PUBLISHED: ['offline','下架','item:offline:own'],
        OFFLINE: ['draft','转为草稿','item:edit:own']
      };
      function add(label, tone, op, method = 'POST') {
        const button = itemUi.button(label, tone);
        button.onclick = async () => {
          const controls = Array.from(actions.querySelectorAll('button'));
          controls.forEach(control => { control.disabled = true; });
          try {
            await write(path + (op ? '/' + op : ''), method, {version:item.version});
            if (method === 'DELETE') { location.href = 'mine.html'; return; }
            await load(label + '成功。');
          } catch (error) {
            if (error.name !== 'AbortError') show(error.message, true);
          } finally {
            controls.forEach(control => { control.disabled = false; });
          }
        };
        actions.append(button);
      }

      const transition = transitions[item.status];
      if (transition && can(transition[2])) add(transition[1], transition[0] === 'submit' ? 'primary' : 'quiet', transition[0]);
      if (itemUi.canHandover(item)) actions.append(itemUi.handoverLink(item.id));
      if (['APPROVED','OFFLINE'].includes(item.status) && can('item:publish')) add('发布','primary','publish');
      if (can('item:delete:own')) add('删除','danger','','DELETE');
    }

    async function load(message = '') {
      if (!/^[1-9][0-9]*$/.test(id || '')) { show('无效的信息编号。', true); return; }
      try {
        const item = await api(path + '/r4-detail');
        document.querySelector('#title').textContent = item.title;
        document.querySelector('#state').replaceChildren(Cms.itemView.idBadge(item.id), Cms.itemView.typeBadge(item), itemUi.badge(item.status));
        document.querySelector('#content').textContent = item.content;
        document.querySelector('#meta').replaceChildren(
          itemUi.fact('地点', item.location || '—'), itemUi.fact('事发时间', itemUi.time(item.eventTime)),
          itemUi.fact('版本', String(item.version ?? '—'))
        );
        renderActions(item);
        detail.hidden = false;
        show(message);
        window.dispatchEvent(new CustomEvent('cms:r4item', {detail:item}));
      } catch (error) {
        if (error.name !== 'AbortError') show(error.message, true);
        return;
      }
      reviews.replaceChildren(itemUi.node('p', 'muted item-review-empty', '正在加载审核记录…'));
      try {
        renderReviews(await api(path + '/reviews'));
      } catch (error) {
        if (error.name !== 'AbortError') reviews.replaceChildren(itemUi.node('p', 'muted item-review-empty', error.message));
      }
    }

    document.addEventListener('DOMContentLoaded', () => load(), {once:true});
  </script>
</body>
</html>
